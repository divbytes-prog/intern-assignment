name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run local tests without provider credentials
        run: python -m pytest -q --ignore=tests/test_streamlit_ui.py

  streamlit-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install UI dependencies
        run: python -m pip install -r requirements-ui.txt
      - name: Run Streamlit UI tests
        run: python -m pytest -q tests/test_streamlit_ui.py

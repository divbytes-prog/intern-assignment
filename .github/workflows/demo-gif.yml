name: Generate README demo GIF

on:
  push:
    paths:
      - '.github/workflows/demo-gif.yml'
      - 'scripts/make_demo_gif.py'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install Pillow==11.3.0
      - name: Generate walkthrough
        run: python -m scripts.make_demo_gif
      - name: Verify animated GIF
        run: |
          python - <<'PY'
          from PIL import Image
          image = Image.open("docs/demo.gif")
          assert image.format == "GIF"
          assert getattr(image, "is_animated", False)
          assert getattr(image, "n_frames", 1) >= 3
          print(f"PASS: demo GIF is animated with {image.n_frames} frames")
          PY

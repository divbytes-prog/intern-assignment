name: Generate README demo GIF

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/make_demo_gif.py'
      - '.github/workflows/demo-gif.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install Pillow==11.3.0
      - name: Generate walkthrough
        run: python -m scripts.make_demo_gif
      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          if git diff --cached --quiet; then
            echo "Demo GIF is already current."
          else
            git commit -m "Add generated interface demo [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
